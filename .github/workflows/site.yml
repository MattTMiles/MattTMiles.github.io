# Builds and deploys the site to GitHub Pages.
#  - on every push to main
#  - every Monday, after refreshing _data/papers.yml from arXiv + Crossref (commits it if changed)
#  - on demand from the repo's Actions tab ("Run workflow")
# Repo Settings -> Pages -> Source must be "GitHub Actions".
name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update papers
        if: github.event_name != 'push'
        run: |
          python3 tools/update_papers.py
          if ! git diff --quiet -- _data/papers.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/papers.yml
            git commit -m "Update papers from arXiv/Crossref"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
