title: Matt Miles
tagline: Matthew T. Miles, astronomer — pulsar timing & gravitational waves
description: >-
  Matthew T. Miles (Matt Miles) is an astronomer and postdoctoral researcher at
  Vanderbilt University working on pulsar timing arrays, pulsar emission, and
  nanohertz gravitational waves with NANOGrav, the MeerKAT Pulsar Timing Array,
  and the IPTA.
# If you buy a custom domain (recommended, see README), put it here and in CNAME.
url: "https://matttmiles.github.io"
baseurl: ""
lang: en_US

author:
  name: Matthew T. Miles
  short_name: Matt Miles
  job_title: Postdoctoral Research Fellow
  affiliation: Vanderbilt University
  affiliation_url: https://www.vanderbilt.edu/physics/
  group: VIPER — Vanderbilt Initiative for Gravitational-wave Research   # TODO check exact name
  group_url: https://as.vanderbilt.edu/viper/
  phd: Swinburne University of Technology
  email: matthew.t.miles@vanderbilt.edu
  location: Nashville, Tennessee, USA
  headshot: /assets/img/matthew-miles-astronomer.jpg

